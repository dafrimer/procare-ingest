apiVersion: v1
kind: Secret
metadata:
  name: {{ include "procare-api.fullname" . }}
  labels:
    {{- include "procare-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  INGEST_TOKEN: {{ required "ingestToken is required (shared with procare-sync)" .Values.ingestToken | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}