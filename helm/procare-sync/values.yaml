schedule: "*/15 * * * *"

image:
  repository: ghcr.io/dafrimer/procare-sync
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

procare:
  siteUrl: https://api-school.procareconnect.com
  authUrl: https://online-auth.procareconnect.com/sessions/
  authToken: ""
  email: ""
  password: ""
  siteId: ""

# Where to find procare-api. Default assumes both charts in same namespace.
api:
  url: http://procare-api:8080
  ingestToken: ""    # must match the api chart's ingestToken

sync:
  activityLookbackDays: 30
  pageSize: 100

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 192Mi
    cpu: 300m

tokenCache:
  storageSize: 10Mi
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}