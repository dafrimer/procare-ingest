apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "procare-sync.fullname" . }}
  labels:
    {{- include "procare-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "procare-sync.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          containers:
            - name: procare-sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              envFrom:
                - configMapRef:
                    name: {{ include "procare-sync.fullname" . }}
                - secretRef:
                    name: {{ include "procare-sync.fullname" . }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: token-cache
                  mountPath: /data
          volumes:
            - name: token-cache
              persistentVolumeClaim:
                claimName: {{ include "procare-sync.fullname" . }}-token-cache
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}