services:
  procare-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: procare-api:dev
    environment:
      SQLITE_PATH: /data/procare.db
      INGEST_TOKEN: ${INGEST_TOKEN}
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      NOTIFY_BACKEND: ${NOTIFY_BACKEND:-log}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_FORMAT: ${NOTIFY_WEBHOOK_FORMAT:-generic}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-60}
      HEARTBEAT_STALE_MINUTES: ${HEARTBEAT_STALE_MINUTES:-30}
    volumes:
      - procare_data:/data
    ports:
      - "${API_PORT_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  procare-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    image: procare-sync:dev
    env_file: .env
    environment:
      API_URL: http://procare-api:8080
      INGEST_TOKEN: ${INGEST_TOKEN}
    volumes:
      - sync_cache:/data
    depends_on:
      procare-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  procare_data:
  sync_cache: