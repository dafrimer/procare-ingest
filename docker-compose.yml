version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME:-procare}
      MYSQL_USER: ${DB_USER:-procare}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  procare-sync:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
    volumes:
      - token_cache:/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  token_cache:
